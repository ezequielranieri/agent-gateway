services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d agent_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-gateway:v1.0.0-rc1
    environment:
      - AG_DATABASE_DSN=postgres://gateway:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/agent_gateway?sslmode=disable
      - AG_REDIS_ADDR=redis:6379
      - AG_REDIS_PASSWORD=${REDIS_PASSWORD}
      - AG_JWT_SECRET=${JWT_SECRET}
      - AG_JWT_ISSUER=agent-gateway
      - AG_JWT_AUDIENCE=agent-gateway-api
      - AG_JWT_ACCESS_TTL=15m
      - AG_JWT_REFRESH_TTL=720h
      - AG_RATELIMIT_DEFAULT_TENANT_REQUESTS_PER_MIN=120
      - AG_RATELIMIT_DEFAULT_TENANT_TOKENS_PER_MIN=50000
      - AG_RATELIMIT_DEFAULT_TENANT_TOOL_EXECS_PER_MIN=30
      - AG_RATELIMIT_FAIL_OPEN=true
      - AG_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
      - AG_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://prometheus:9090/api/v1/otlp
      - AG_OTEL_SERVICE_NAME=agent-gateway
      - AG_SERVER_ADDR=:8080
      - AG_SERVER_ENV=staging
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

volumes:
  pgdata:
  prometheus_data: