version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/adapter/postgres/sqlc"
    gen:
      go:
        package: "postgres"
        out: "internal/adapter/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "json.RawMessage"