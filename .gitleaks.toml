# Gitleaks configuration for agent-gateway
# https://github.com/gitleaks/gitleaks

title = "agent-gateway gitleaks config"

[allowlist]
  description = "Combined allowlist for false positives"
  files = [
    "internal/api/openapi.go",
    ".env.example",
    ".env.staging",
    ".env.prod"
  ]
  regexes = [
    # Example JWT tokens in OpenAPI spec comments
    "eyJ[a-zA-Z0-9_-]+\\.[a-zA-Z0-9_-]+\\.[a-zA-Z0-9_-]+",
    "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4uLi4=",
    # Staging/prod env files with placeholder secrets
    'POSTGRES_PASSWORD=.*',
    'REDIS_PASSWORD=.*',
    'JWT_SECRET=.*'
  ]