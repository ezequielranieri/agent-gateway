name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gateway -d agent_gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/agent_gateway?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check for disabled test files
        run: |
          if find . -name "*.disabled" -type f | grep -q .; then
            echo "ERROR: Found disabled test files:"
            find . -name "*.disabled" -type f
            echo "All tests must be enabled. Remove .disabled suffix or delete the file."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - name: Generate sqlc code
        run: sqlc generate
      - name: Run migrations
        run: |
          goose -dir migrations postgres "$DATABASE_URL" up
      - name: Create test role and set test DSN
        run: |
          psql "$DATABASE_URL" -c "CREATE ROLE gateway_test WITH LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'gateway_test';"
          psql "$DATABASE_URL" -c "GRANT USAGE ON SCHEMA public TO gateway_test;"
          psql "$DATABASE_URL" -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gateway_test;"
          psql "$DATABASE_URL" -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gateway_test;"
      - name: Verify test role
        run: |
          psql "postgres://gateway_test:gateway_test@localhost:5432/agent_gateway?sslmode=disable" -c "SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user;"
      - name: Run unit tests
        run: go test -count=1 ./internal/...
      - name: Run integration tests
        run: go test -tags integration -count=1 -v ./...
        env:
          TEST_DATABASE_URL: postgres://gateway_test:gateway_test@localhost:5432/agent_gateway?sslmode=disable
      - name: Check for SKIP in test output
        run: |
          # This step runs integration tests again to check for SKIP
          # If any test is SKIPped, fail the build (except allowlisted skips)
          output=$(go test -tags integration -count=1 -v ./... 2>&1 || true)
          echo "$output"
          # Allowlist: only these patterns are allowed to SKIP
          allowed_skips=("Skipping integration test in short mode")
          skip_found=false
          while IFS= read -r line; do
            if echo "$line" | grep -q "--- SKIP"; then
              allowed=false
              for pattern in "${allowed_skips[@]}"; do
                if echo "$line" | grep -q "$pattern"; then
                  allowed=true
                  break
                fi
              done
              if [ "$allowed" = false ]; then
                echo "ERROR: Unexpected SKIP found: $line"
                skip_found=true
              fi
            fi
          done <<< "$output"
          if [ "$skip_found" = true ]; then
            exit 1
          fi

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lint and vulnerability scan run locally (golangci-lint, trivy)
  # See Makefile: make lint && make vuln-scan