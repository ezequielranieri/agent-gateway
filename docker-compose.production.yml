services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d agent_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    command: sh -c "redis-server --requirepass $${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-gateway:${VERSION:-latest}
    environment:
      - AG_DATABASE_DSN=postgres://gateway:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/agent_gateway?sslmode=disable
      - AG_REDIS_ADDR=redis:6379
      - AG_REDIS_PASSWORD=${REDIS_PASSWORD}
      - AG_JWT_SECRET=${JWT_SECRET}
      - AG_JWT_ISSUER=agent-gateway
      - AG_JWT_AUDIENCE=agent-gateway-api
      - AG_JWT_ACCESS_TTL=15m
      - AG_JWT_REFRESH_TTL=720h
      - AG_RATELIMIT_DEFAULT_TENANT_REQUESTS_PER_MIN=120
      - AG_RATELIMIT_DEFAULT_TENANT_TOKENS_PER_MIN=50000
      - AG_RATELIMIT_DEFAULT_TENANT_TOOL_EXECS_PER_MIN=30
      - AG_RATELIMIT_FAIL_OPEN=true
      - AG_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
      - AG_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://prometheus:9090/api/v1/otlp
      - AG_OTEL_SERVICE_NAME=agent-gateway
      - AG_SERVER_ADDR=:8080
      - AG_SERVER_ENV=production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first

  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
    restart: unless-stopped
    volumes:
      - jaeger_data:/var/lib/jaeger

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  alertmanager:
    image: prom/alertmanager:v0.26.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  jaeger_data:
  alertmanager_data:
  grafana_data: